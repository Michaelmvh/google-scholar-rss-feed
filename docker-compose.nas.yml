# Deployment for a Synology NAS that exposes the feed to the internet (e.g. for
# TRMNL) via a Cloudflare Tunnel. No router ports need to be opened.
#
# 1. Create a tunnel in the Cloudflare Zero Trust dashboard and copy its token.
# 2. Put the token in a `.env` file next to this file:  TUNNEL_TOKEN=xxxxxxxx
# 3. In the dashboard, add a Public Hostname for the tunnel that routes your
#    domain (e.g. scholar.example.com) to the service:  http://scholar-rss:3005
#
# See the README section "Exposing the feed to the internet (Cloudflare Tunnel)".

services:
  scholar-rss:
    image: ghcr.io/michaelmvh/google-scholar-rss-feed:latest
    container_name: scholar-rss
    # No published ports needed: cloudflared reaches it over the internal network.
    expose:
      - "3005"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: scholar-rss-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - scholar-rss
    restart: unless-stopped
